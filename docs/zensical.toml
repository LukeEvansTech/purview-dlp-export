# Zensical Configuration
# https://zensical.org/docs/

[project]
site_name = "Purview DLP Export"
site_description = "Read-only export of a Microsoft Purview DLP ruleset to a re-runnable, idempotent baseline (JSON + Markdown summary + audit sidecar)"
site_author = "Luke Evans"
site_url = "https://lukeevanstech.github.io/purview-dlp-export/"
copyright = "Copyright © 2026 Luke Evans"

docs_dir = "docs"
site_dir = "site"
use_directory_urls = true
dev_addr = "localhost:8000"

[project.theme]
name = "material"
variant = "modern"
language = "en"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue"
accent = "light-blue"

[project.theme.palette.toggle]
icon = "material/brightness-7"
name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue"
accent = "light-blue"

[project.theme.palette.toggle]
icon = "material/brightness-4"
name = "Switch to light mode"

[project.theme.icon]
repo = "fontawesome/brands/github"

# Repository Integration
repo_url = "https://github.com/LukeEvansTech/purview-dlp-export/"
repo_name = "LukeEvansTech/purview-dlp-export"
edit_uri = "edit/main/docs/docs"

# Navigation Structure
[[project.nav]]
Home = "index.md"

[[project.nav]]
"Quick start" = "quickstart.md"

[[project.nav]]
"Smoke test (PS 5.1)" = "runbook-ps51.md"

[[project.nav]]
"Output schema" = "output-schema.md"

[[project.nav]]
Troubleshooting = "troubleshooting.md"

[[project.nav]]
Contributing = "contributing.md"

[[project.nav]]
Changelog = "CHANGELOG.md"
